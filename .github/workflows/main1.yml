name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔧 Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: 🏗️ Create Windows Project
        run: |
          flutter create --platforms=windows .
          echo "✅ Windows project created"

      - name: 🚀 Build Windows EXE
        run: |
          flutter build windows --release
          echo "✅ Build complete"

      - name: 📂 Find and Zip EXE
        run: |
          echo "Looking for EXE..."
          dir build\windows\runner\Release\*.exe 2>nul
          if %errorlevel% equ 0 (
            7z a Moon_Cosmetics_POS.zip build\windows\runner\Release\*
          ) else (
            echo "Trying alternative path..."
            dir build\windows\x64\runner\Release\*.exe 2>nul
            if %errorlevel% equ 0 (
              7z a Moon_Cosmetics_POS.zip build\windows\x64\runner\Release\*
            ) else (
              echo "EXE not found!"
              exit 1
            )
          )

      - name: 📤 Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Cosmetics-POS
          path: Moon_Cosmetics_POS.zip
          retention-days: 30
