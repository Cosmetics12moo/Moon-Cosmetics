name: Build Windows EXE (Debug)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'
          cache: true

      - name: 🔍 Flutter Doctor
        run: flutter doctor -v

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔧 Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: 📂 List Files Before Build
        run: |
          Get-ChildItem -Recurse
          Write-Host "=== Current Directory ==="
          pwd

      - name: 🏗️ Build Windows EXE
        run: flutter build windows --release
        continue-on-error: true

      - name: 📂 Check Build Output
        run: |
          Write-Host "=== Checking build/windows/ ==="
          if (Test-Path "build/windows/") {
            Get-ChildItem -Recurse build/windows/
          } else {
            Write-Host "build/windows/ not found!"
          }

      - name: 🔍 Find EXE
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*.exe" -Path build/
          if ($exe) {
            Write-Host "Found EXE: $exe"
            $exe | ForEach-Object {
              Copy-Item $_.FullName -Destination "Moon_Cosmetics_POS.exe"
            }
            Compress-Archive -Path Moon_Cosmetics_POS.exe -DestinationPath Moon_Cosmetics_POS.zip
          } else {
            Write-Host "No EXE found!"
            exit 1
          }

      - name: 📤 Upload EXE Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Cosmetics-POS
          path: Moon_Cosmetics_POS.zip
          retention-days: 30
