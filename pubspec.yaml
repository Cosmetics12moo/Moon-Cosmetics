name: moon_cosmetics_pos
description: Moon Cosmetics & Beauty Shop - Professional POS System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  
  # Database
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  
  # State Management
  provider: ^6.1.1
  get_it: ^7.7.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  image_picker: ^1.0.7
  
  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Excel & Data
  excel: ^4.0.4
  csv: ^6.0.0
  
  # File System
  path_provider: ^2.1.2
  path: ^1.9.0
  file_picker: ^6.2.0
  
  # Date & Time
  intl: ^0.19.0
  timezone: ^0.9.2
  
  # Utilities
  uuid: ^4.3.3
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  
  # Barcode
  barcode: ^2.2.7
  barcode_widget: ^2.0.4
  
  # Keyboard Shortcuts
  flutter_keyboard_visibility: ^6.0.0
  
  # Desktop
  bitsdojo_window: ^0.1.5
  window_manager: ^0.3.8
  screen_retriever: ^0.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
    - assets/database/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700